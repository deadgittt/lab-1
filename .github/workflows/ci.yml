name: Haskell CI

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build-and-test:
    name: 🧱 Build & Test (Stack)
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout repo
        uses: actions/checkout@v4

      - name: ⚙️ Set up Haskell (Stack)
        uses: haskell/actions/setup@v2
        with:
          enable-stack: true
          stack-version: "latest"

      - name: 💾 Cache Stack
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            .stack-work
          key: ${{ runner.os }}-stack-${{ hashFiles('**/stack.yaml.lock') }}
          restore-keys: |
            ${{ runner.os }}-stack-

      - name: 🧰 Show tool versions
        run: |
          stack --version
          stack path

      - name: 🧱 Build project
        run: stack build --no-terminal --fast

      - name: 🧪 Run tests
        run: stack test --no-terminal --fast


  lint-and-format:
    name: 🔍 Lint & Format (HLint + Ormolu)
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout repo
        uses: actions/checkout@v4

      - name: ⚙️ Set up Haskell (Stack)
        uses: haskell/actions/setup@v2
        with:
          enable-stack: true
          stack-version: "latest"

      - name: 💾 Cache Stack
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            .stack-work
          key: ${{ runner.os }}-stack-lint-${{ hashFiles('**/stack.yaml.lock') }}
          restore-keys: |
            ${{ runner.os }}-stack-

      - name: 🧰 Install HLint & Ormolu
        run: |
          stack install hlint ormol
